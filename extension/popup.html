<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Veo3 Ultra Flow Bridge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 12px;
    }
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #21262d;
    }
    .header-icon { font-size: 18px; line-height: 1; }
    .header-name { font-size: 13px; font-weight: 700; color: #f0f6fc; }
    .header-ver  { font-size: 10px; color: #58a6ff; margin-top: 1px; }
    .btn-icon {
      margin-left: auto;
      background: #21262d; border: 1px solid #30363d;
      border-radius: 6px; color: #c9d1d9;
      cursor: pointer; padding: 4px 8px; font-size: 11px;
      transition: all .15s;
    }
    .btn-icon:hover { background: #30363d; border-color: #58a6ff; }
    .conn-bar {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green  { background: #2ea043; box-shadow: 0 0 6px #2ea043aa; }
    .dot-red    { background: #da3633; }
    .dot-yellow { background: #d29922; animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .conn-text { color: #8b949e; font-size: 11px; flex: 1; }
    .conn-text b { color: #c9d1d9; }

    .tab-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 14px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      font-size: 11px; color: #8b949e;
    }
    .tab-left { display: flex; align-items: center; gap: 6px; }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #484f58; }
    .tab-dot.found { background: #2ea043; }
    .btn-tab {
      background: none; border: 1px solid #30363d; border-radius: 4px;
      color: #58a6ff; cursor: pointer; padding: 2px 6px; font-size: 10px;
    }
    .btn-tab:hover { background: #1f2937; }

    .credits-card {
      margin: 10px 14px; padding: 10px 12px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .credits-label { font-size: 11px; color: #94a3b8; }
    .credits-val { font-size: 18px; font-weight: 700; color: #38bdf8; }
    .btn-check-credits {
      background: #0284c7; border: none; border-radius: 4px;
      color: #ffffff; padding: 4px 10px; font-size: 11px; cursor: pointer;
      font-weight: 600;
    }
    .btn-check-credits:hover { background: #0369a1; }

    .grid-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 0 14px 10px;
    }
    .stat-card {
      background: #161b22; border: 1px solid #21262d; border-radius: 6px;
      padding: 7px 8px; text-align: center;
    }
    .stat-num { font-size: 15px; font-weight: 700; color: #f0f6fc; line-height: 1.2; }
    .stat-lbl { font-size: 10px; color: #8b949e; margin-top: 2px; }

    .log-section {
      padding: 8px 14px 12px;
      border-top: 1px solid #21262d;
    }
    .log-title {
      font-size: 11px; font-weight: 600; color: #8b949e; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .log-box {
      background: #161b22; border: 1px solid #21262d; border-radius: 6px;
      max-height: 120px; overflow-y: auto; font-family: ui-monospace, monospace;
      font-size: 10px; line-height: 1.5; padding: 6px;
    }
    .log-item { display: flex; justify-content: space-between; gap: 4px; padding: 2px 0; border-bottom: 1px solid #21262d44; }
    .log-time { color: #64748b; }
    .log-type { color: #38bdf8; font-weight: 600; }
    .log-ok { color: #4ade80; }
    .log-fail { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">⚡</span>
    <div>
      <div class="header-name">Veo3 Ultra Bridge</div>
      <div class="header-ver">v4.0.0 (BOQ batchexecute)</div>
    </div>
    <button class="btn-icon" id="btnReconnect">🔄 Reconnect</button>
  </div>

  <div class="conn-bar">
    <div class="dot dot-yellow" id="connDot"></div>
    <div class="conn-text" id="connText">Đang kết nối: <b>127.0.0.1:3003</b></div>
  </div>

  <div class="tab-bar">
    <div class="tab-left">
      <div class="tab-dot" id="tabDot"></div>
      <span id="tabText">Kiểm tra tab flow.google.com...</span>
    </div>
    <button class="btn-tab" id="btnOpenFlow">Mở tab Flow</button>
  </div>

  <div class="credits-card">
    <div>
      <div class="credits-label">Credits còn lại</div>
      <div class="credits-val" id="creditsVal">--</div>
    </div>
    <button class="btn-check-credits" id="btnCheckCredits">Kiểm tra</button>
  </div>

  <div class="grid-stats">
    <div class="stat-card">
      <div class="stat-num" id="statReq">0</div>
      <div class="stat-lbl">Yêu cầu</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statSuccess" style="color:#3fb950;">0</div>
      <div class="stat-lbl">Thành công</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statFailed" style="color:#f85149;">0</div>
      <div class="stat-lbl">Thất bại</div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-title">
      <span>RPC Activity Log</span>
      <span style="font-size: 10px; color:#64748b;">(nzlxg / ogiZ0b / eb1hJf)</span>
    </div>
    <div class="log-box" id="logBox">
      <div style="color: #64748b; text-align: center; padding: 8px;">Chưa có RPC request nào</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
