<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Veo3 Ultra Captcha Worker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 12px;
    }

    /* ── Header ──────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #21262d;
    }
    .header-icon { font-size: 18px; line-height: 1; }
    .header-name { font-size: 13px; font-weight: 700; color: #f0f6fc; }
    .header-ver  { font-size: 10px; color: #484f58; margin-top: 1px; }
    .btn-icon {
      margin-left: auto;
      background: none; border: 1px solid #30363d;
      border-radius: 6px; color: #8b949e;
      cursor: pointer; padding: 4px 8px; font-size: 12px;
      transition: border-color .15s, color .15s;
    }
    .btn-icon:hover { border-color: #6e7681; color: #c9d1d9; }

    /* ── Connection bar ───────────────────────────────────── */
    .conn-bar {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-green  { background: #2ea043; box-shadow: 0 0 5px #2ea04388; }
    .dot-red    { background: #da3633; }
    .dot-yellow { background: #d29922; animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .conn-text { color: #8b949e; font-size: 11px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conn-text b { color: #c9d1d9; }

    /* ── Tab status ───────────────────────────────────────── */
    .tab-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: #0d1117;
      border-bottom: 1px solid #21262d;
      font-size: 11px; color: #8b949e;
    }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #484f58; flex-shrink: 0; }
    .tab-dot.found { background: #2ea043; }
    .tab-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-open-btn {
      background: none; border: 1px solid #30363d; border-radius: 4px;
      color: #8b949e; cursor: pointer; padding: 2px 7px; font-size: 10px;
      white-space: nowrap;
      transition: border-color .15s, color .15s;
    }
    .tab-open-btn:hover { border-color: #58a6ff; color: #58a6ff; }

    /* ── Stats grid ───────────────────────────────────────── */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: #21262d;
      border-bottom: 1px solid #21262d;
    }
    .stat {
      background: #0d1117; padding: 9px 12px; text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 700; line-height: 1.1; }
    .stat-val.g { color: #2ea043; }
    .stat-val.r { color: #da3633; }
    .stat-val.b { color: #58a6ff; }
    .stat-val.y { color: #d29922; }
    .stat-lbl { font-size: 10px; color: #484f58; margin-top: 3px; text-transform: uppercase; letter-spacing: .4px; }

    /* ── Active jobs bar ──────────────────────────────────── */
    .jobs-bar {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 14px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      font-size: 11px; color: #8b949e;
    }
    .jobs-count { font-weight: 700; font-size: 13px; color: #d29922; }
    .prog { flex:1; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
    .prog-fill { height: 100%; background: #1f6feb; border-radius: 2px; transition: width .3s; }
    .queued-lbl { font-size: 10px; color: #484f58; }

    /* ── Last token ───────────────────────────────────────── */
    .last-row {
      padding: 6px 14px;
      font-size: 11px; color: #484f58;
      border-bottom: 1px solid #21262d;
      min-height: 26px;
    }
    .last-row span { color: #6e7681; }

    /* ── Debug log ────────────────────────────────────────── */
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 14px 4px;
      border-bottom: 1px solid #21262d;
      font-size: 10px; color: #484f58; text-transform: uppercase; letter-spacing: .4px;
    }
    .log-clear { background: none; border: none; color: #484f58; cursor: pointer; font-size: 10px; }
    .log-clear:hover { color: #8b949e; }
    #debugLog {
      height: 72px; overflow-y: auto;
      padding: 4px 14px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 10px; color: #6e7681;
      line-height: 1.6;
      border-bottom: 1px solid #21262d;
    }
    #debugLog .ok   { color: #2ea043; }
    #debugLog .err  { color: #da3633; }
    #debugLog .info { color: #58a6ff; }
    #debugLog .warn { color: #d29922; }

    /* ── Actions ──────────────────────────────────────────── */
    .actions {
      display: flex; gap: 6px; padding: 10px 14px 12px;
    }
    .btn {
      flex: 1; padding: 6px 8px;
      border: 1px solid transparent; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover   { opacity: .82; }
    .btn:active  { opacity: .6; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-green  { background: #238636; border-color: #2ea043; color: #f0f6fc; }
    .btn-blue   { background: #1f6feb; border-color: #388bfd; color: #f0f6fc; }
    .btn-red    { background: #da3633; border-color: #f85149; color: #f0f6fc; }
    .btn-ghost  { background: #161b22; border-color: #30363d; color: #c9d1d9; }

    /* ── Toast ────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 5px 12px; font-size: 11px; color: #c9d1d9;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity .2s; z-index: 99;
    }
    .toast.show   { opacity: 1; }
    .toast.ok     { border-color: #2ea043; color: #7ee787; }
    .toast.err    { border-color: #da3633; color: #ff7b72; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="header-icon">⚡</span>
  <div>
    <div class="header-name">Veo3 Captcha Worker</div>
    <div class="header-ver">v3.0.0</div>
  </div>
  <button class="btn-icon" id="settingsBtn" title="Settings">⚙</button>
</div>

<!-- Connection status -->
<div class="conn-bar">
  <div class="dot dot-red" id="connDot"></div>
  <div class="conn-text" id="connText">Đang kiểm tra...</div>
</div>

<!-- Tab status -->
<div class="tab-bar">
  <div class="tab-dot" id="tabDot"></div>
  <div class="tab-label" id="tabLabel">Chưa phát hiện tab labs.google</div>
  <button class="tab-open-btn" id="openTabBtn">Mở Tab</button>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-val g" id="statSuccess">0</div><div class="stat-lbl">Thành công</div></div>
  <div class="stat"><div class="stat-val r" id="statError">0</div><div class="stat-lbl">Lỗi</div></div>
  <div class="stat"><div class="stat-val b" id="statReceived">0</div><div class="stat-lbl">Nhận được</div></div>
  <div class="stat"><div class="stat-val y" id="statTimeout">0</div><div class="stat-lbl">Timeout</div></div>
</div>

<!-- Active jobs -->
<div class="jobs-bar">
  <span>Đang chạy:</span>
  <span class="jobs-count" id="activeJobs">0</span>
  <span>/ 3</span>
  <div class="prog"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <span class="queued-lbl" id="queuedLbl"></span>
</div>

<!-- Last token time -->
<div class="last-row" id="lastToken">Token gần nhất: <span>—</span></div>

<!-- Debug log -->
<div class="log-header">
  <span>Debug log</span>
  <button class="log-clear" id="clearLog">Xóa</button>
</div>
<div id="debugLog"></div>

<!-- Buttons -->
<div class="actions">
  <button class="btn btn-green" id="testBtn">▶ Test</button>
  <button class="btn btn-blue"  id="reconnectBtn">↺ Kết nối lại</button>
  <button class="btn btn-red"   id="disconnectBtn">✕</button>
</div>

<div class="toast" id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
